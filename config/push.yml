# Native push configuration. See docs/push_notifications.md for setup.
shared:
  apple: &apple
    # Token authentication (.p8 key) from the Apple Developer portal
    key_id: <%= ENV['APNS_KEY_ID'] %>
    encryption_key: <%= ENV['APNS_ENCRYPTION_KEY']&.gsub('\n', "\n") %>
    team_id: <%= ENV['APPLE_TEAM_ID'] %>
    topic: <%= ENV['APPLE_BUNDLE_ID'] %>
    application_name: CoLab
  firebase: &firebase
    # Firebase service account (FCM HTTP v1)
    encryption_key: <%= ENV['FCM_SERVICE_ACCOUNT_JSON'] %>
    project_id: <%= ENV['FCM_PROJECT_ID'] %>

production:
  apple:
    <<: *apple
    environment: production
  firebase: *firebase

development:
  apple:
    <<: *apple
    environment: development
  firebase: *firebase

test:
  apple:
    <<: *apple
    environment: development
  firebase: *firebase
